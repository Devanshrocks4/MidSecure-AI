[build]
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA redirect - only routes, NOT static assets
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Exclude assets from redirect - must come AFTER the main redirect
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

# Cache busting for static assets
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
